<svg width="40px" height="40px"
  viewBox="0 0 40 40"
  xmlns="http://www.w3.org/2000/svg"
  style="animation: spin 1.2s
    linear infinite;">
  <defs>
    <linearGradient id="aura"
      x1="0" y1="20"
      x2="40" y2="20"
      gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F9E94E"/>
      <stop offset="18%" stop-color="#A8E86A"/>
      <stop offset="36%" stop-color="#5DD68C"/>
      <stop offset="50%" stop-color="#34C8C8"/>
      <stop offset="64%" stop-color="#3A9FE8"/>
      <stop offset="78%" stop-color="#7B6EF0"/>
      <stop offset="88%" stop-color="#C45FD4"/>
      <stop offset="95%" stop-color="#F56565"/>
      <stop offset="100%" stop-color="#F9E94E"/>
    </linearGradient>
  </defs>
  <circle
    cx="20"
    cy="20"
    r="15"
    stroke="url(#aura)"
    stroke-width="3"
    fill="none"
    stroke-linecap="round"
    stroke-dasharray="9999"
    stroke-dashoffset="0"
  />
</svg>